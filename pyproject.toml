[project]
name = "okamo-channel"
version = "0.1.0"
description = "okamoちゃんねる — AI 3人が2ch風BBSで記事をレビューする自律議論システム"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[anthropic,bedrock,openai,gemini]",
    "strands-agents-tools",
    # mcp 2.x removed the deprecated `streamablehttp_client` alias that
    # strands-agents 1.48.0 and main.py import. Keep the 1.x line.
    "mcp>=1.23,<2",
    "litellm",
    "fastapi",
    "orjson",
    "python-dotenv",
    "requests",
    "beautifulsoup4",
    "boto3",
    "jinja2",
]

[project.scripts]
okamo-channel = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
