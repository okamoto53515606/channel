[project]
name = "okamo-channel"
version = "0.1.0"
description = "okamoちゃんねる — AI 3人が2ch風BBSで記事をレビューする自律議論システム"
requires-python = ">=3.12"
dependencies = [
    # mcp 2.x が必要（litellm 1.100+ が mcp.types.CacheableResult を import する）。
    # strands-agents 1.55+ は mcp 1.x/2.x 両対応で MCPClient(url=...) が使える。
    "strands-agents[anthropic,bedrock,openai,gemini]>=1.55",
    "strands-agents-tools",
    "mcp>=2,<3",
    "litellm",
    "fastapi",
    "orjson",
    "python-dotenv",
    "requests",
    "beautifulsoup4",
    "boto3",
    "jinja2",
]

[project.scripts]
okamo-channel = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
